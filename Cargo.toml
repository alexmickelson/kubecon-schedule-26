[package]
name = "kubecon-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Time-aware terminal schedule for KubeCon + CloudNativeCon North America"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
